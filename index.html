    <script>
        var allBtns = document.getElementsByClassName("open-modal");
        var modal = document.getElementById("modal");

        var mClose = document.getElementById("modal-close");
        var mTitle = document.getElementById("modal-title");
        var mText = document.getElementById("modal-desc");
        var mImg = document.getElementById("modal-img");

        // open modal & check for extra image
        for (let i = 0; i < allBtns.length; i++) {
            const btn = allBtns[i];

            btn.onclick = function (event) {
                var data = event.currentTarget.dataset // element attributes
                mText.innerHTML = data.desc
                mTitle.innerHTML = data.title
                mImg.src = data.src
                mImg.alt = data.alt
                if (data.src2) { // optional second image
                    var newImg = document.createElement("img");
                    newImg.setAttribute("id", "modal-img2");
                    newImg.src = data.src2;
                    newImg.alt = data.alt2;
                    document.getElementById("modal-content").appendChild(newImg);
                }
                modal.style.display = "block";
            }
        }

        // close modal & check for extra image
        mClose.onclick = function () {
            modal.style.display = "none";
            if (document.getElementById("modal-img2")) {
                document.getElementById("modal-img2").remove();
            }
        }
        window.onclick = function (event) {
            if (event.target == modal) {
                modal.style.display = "none";
                if (document.getElementById("modal-img2")) {
                    document.getElementById("modal-img2").remove();
                }
            }
        }



    </script>
